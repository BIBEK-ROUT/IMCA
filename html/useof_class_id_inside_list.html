<!DOCTYPE html>
<html>
<head>
    <title>List Attribute Demo</title>
    <style>
        /* Class-based styling */
        .fancy-list {
            background-color: #f0f8ff;
            padding: 10px;
            border: 3px dashed greenyellow;
            width: 250px;
        }

        .important-item {
            color: red;
            font-weight: bold;
        }

        /* ID-based styling */
        #tech-skills {
            font-family: 'Arial';
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>My Tech Skills</h2>

    <ul id="tech-skills" class="fancy-list">
        <li>HTML</li>
        <li class="important-item">CSS</li>
        <li>JavaScript</li>
        <li style="color: green; font-style: italic;">Python</li>
    </ul>

</body>
</html>
