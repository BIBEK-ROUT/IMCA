<!DOCTYPE html>
<html>
<head>
    <title>List Attribute Demo</title>
    <style>
        /* Class-based styling */
        .fancy-list {
            background-color: #f0f8ff;
            padding: 10px;
            border: 3px dotted  rgb(149, 41, 215);
            width: 250px;
        }

        .important-item {
            color: red;
            font-weight: bold;
        }

        /* ID-based styling */
        #tech-skills {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 30px;
        }
    </style>
</head>
<body>

    <h2>My Tech Skills</h2>

    <ul  class="fancy-list">
        <li>HTML</li>
        <li class="important-item">CSS</li>
        <li>JavaScript</li>
        <li style="color: green; font-style: italic; font-size: large;">Python</li>
    </ul>
    <p id="tech-skills">haga nejuka</p>
</body>
</html>
