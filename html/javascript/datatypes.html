<!DOCTYPE html>
<html>
<body>

<script>
  // Declare variables
  const name = "Bibek";
  let age = 20;
  var isStudent = true;

  // Show data types
  document.write(typeof name); // string
  document.write(typeof age);      // number
  document.write(typeof isStudent); // boolean

  // Use a null and undefined
  let favColor = null;
  let score;

  console.log(favColor); // null
  console.log(score);    // undefined
</script>

</body>
</html>
