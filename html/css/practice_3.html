<html>
    <head>
        <style>
.card {
  box-shadow: 25px 20px 8px  gray; /* Shadow effect */
  padding: 20px;
  width: 250px;
  background: #dd0a4d;
  border-radius: 10px;
  text-align: center;
}

.avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;       /* Circular image */
  object-fit:cover;
  margin-bottom: 15px;
}

#name {
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #2a9d8f;          /* Custom font color */
  font-size: 1.3em;
  font-weight: bold;
  margin-bottom: 5px;
}

.title {
  color: #1e0606;
  font-size: 1em;
  margin-bottom: 8px;
}

.info {
  color: #d4afaf;
  font-size: 0.95em;
}
</style>
</head>
<body>

  <div class="card">
  <img src="https://www.codester.com/static/uploads/items/000/048/48437/preview/001.jpg" alt="Avatar" class="avatar">
  <div id="name">Bibek Rout</div>
  <div class="title">Web Developer</div>
  <div class="info">San Francisco, CA</div>
</div>

</body>
</html>
