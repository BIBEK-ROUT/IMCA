<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Table</title>
</head>
<body>
    <h1>This is a table regarding product availability and price</h1>
    <table border="3" align="center" bgcolor="lightblue">
        <caption>Flipkart Product Info</caption>
        <thead>
            <tr>
                <th rowspan="3">Product Name</th>
                <th colspan="3">Details</th>
            </tr>
            <tr>
                <th>Price</th>
                <th bgcolor="red">Availability</th>
                <th>tax</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Smart phone</td>
                <td>67$</td>
                <td>In Stock</td>
                <td>30%</td>
            </tr>
            <tr>
                <td>Laptop</td>
                <td>1000$</td>
                <td>Out of Stock</td>
                <td>40%</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
