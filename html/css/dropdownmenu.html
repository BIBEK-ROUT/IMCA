<!DOCTYPE html>
<html>
<head>
  <style>
    /* Basic navbar styling */
    .navbar {
      background-color: #de0e0e;
      overflow: hidden;
    }

    .navbar a {
      float: left;
      color: white;
      padding: 14px 16px;
      text-decoration: none;
    }

    .dropdown {
      float: left;
      overflow: hidden;
    }

    .dropdown .dropbtn {
      font-size: 16px;
      border: none;
      outline: none;
      color: white;
      padding: 14px 16px;
      background-color: inherit;
    }

    .navbar a:hover,
    .dropdown:hover .dropbtn {
      background-color: #575757;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      z-index: 1;
    }

    .dropdown-content a {
      float: none;
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .dropdown-content a:hover {
      background-color: #ddd;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>

<div class="navbar">
  <a href="#">Home</a>
  <a href="#">About</a>
  <div class="dropdown">
    <button class="dropbtn">Services ▼</button>
    <div class="dropdown-content">
      <a href="#">Web Design</a>
      <a href="#">SEO</a>
      <a href="#">Hosting</a>
    </div>
  </div>
  <a href="#">Contact</a>
</div>

</body>
</html>
